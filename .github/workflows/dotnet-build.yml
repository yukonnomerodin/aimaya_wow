name: .NET 8 Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Adapter.AuthGateway/Adapter.AuthGateway.csproj

      - name: Build
        run: dotnet build src/Adapter.AuthGateway/Adapter.AuthGateway.csproj --configuration Release --no-restore
