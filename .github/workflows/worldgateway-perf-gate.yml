name: WorldGateway Perf Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hypothesis_id:
        description: "HypothesisId used for gateway start and summary metadata"
        required: false
        default: "M2-R6-CI-CAPACITY-BENCHMARK-SLO-PROMOTION-108"
      iterations:
        description: "Target successful probe iterations"
        required: true
        default: "30"
      parallelism:
        description: "Concurrent probe jobs"
        required: true
        default: "4"
      p50_gate_ms:
        description: "p50 latency gate in ms (0 disables)"
        required: true
        default: "500"
      p95_gate_ms:
        description: "p95 latency gate in ms (0 disables)"
        required: true
        default: "560"
      max_gate_ms:
        description: "max latency gate in ms (0 disables)"
        required: true
        default: "650"
      max_failure_rate_pct:
        description: "max probe failure rate in percent"
        required: true
        default: "8.0"
      max_db_timeout_rate_pct:
        description: "max DB auth-bridge timeout rate in percent"
        required: true
        default: "0.5"
      max_diag_queue_saturation_rate_pct:
        description: "max diagnostics queue saturation fallback rate in percent"
        required: true
        default: "1.0"

jobs:
  perf-gate:
    name: Perf Gate (Self-Hosted Windows)
    runs-on: [self-hosted, windows]
    env:
      PERF_HYPOTHESIS_ID: ${{ github.event.inputs.hypothesis_id || 'M2-R6-CI-CAPACITY-BENCHMARK-SLO-PROMOTION-108' }}
      PERF_ITERATIONS: ${{ github.event.inputs.iterations || '30' }}
      PERF_PARALLELISM: ${{ github.event.inputs.parallelism || '4' }}
      PERF_P50_GATE_MS: ${{ github.event.inputs.p50_gate_ms || '500' }}
      PERF_P95_GATE_MS: ${{ github.event.inputs.p95_gate_ms || '560' }}
      PERF_MAX_GATE_MS: ${{ github.event.inputs.max_gate_ms || '650' }}
      PERF_MAX_FAILURE_RATE_PCT: ${{ github.event.inputs.max_failure_rate_pct || '8.0' }}
      PERF_MAX_DB_TIMEOUT_RATE_PCT: ${{ github.event.inputs.max_db_timeout_rate_pct || '0.5' }}
      PERF_MAX_DIAG_QUEUE_SAT_RATE_PCT: ${{ github.event.inputs.max_diag_queue_saturation_rate_pct || '1.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build WorldGateway
        shell: powershell
        run: dotnet build src/Adapter.WorldGateway/Adapter.WorldGateway.csproj

      - name: Start Retail Gateways
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/start_retail_gateways.ps1 `
            -HypothesisId "${{ env.PERF_HYPOTHESIS_ID }}"

      - name: Run Probe Perf Gate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_world_probe_perf_gate.ps1 `
            -Iterations ${{ env.PERF_ITERATIONS }} `
            -Parallelism ${{ env.PERF_PARALLELISM }} `
            -P50GateMs ${{ env.PERF_P50_GATE_MS }} `
            -P95GateMs ${{ env.PERF_P95_GATE_MS }} `
            -MaxDurationGateMs ${{ env.PERF_MAX_GATE_MS }} `
            -MaxFailureRatePercent ${{ env.PERF_MAX_FAILURE_RATE_PCT }} `
            -HypothesisId "${{ env.PERF_HYPOTHESIS_ID }}"

      - name: Run Runtime Error Budget Gate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_world_probe_runtime_error_budget_gate.ps1 `
            -HypothesisId "${{ env.PERF_HYPOTHESIS_ID }}" `
            -PerfSummaryPath "docs/handshake/runlogs/probe_perf_gate.latest.json" `
            -MaxRelayFailureRatePercent ${{ env.PERF_MAX_FAILURE_RATE_PCT }} `
            -MaxDbTimeoutRatePercent ${{ env.PERF_MAX_DB_TIMEOUT_RATE_PCT }} `
            -MaxDiagnosticsQueueSaturationRatePercent ${{ env.PERF_MAX_DIAG_QUEUE_SAT_RATE_PCT }}
