name: WorldGateway Scale Profiles Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hypothesis_id:
        description: "HypothesisId used for gateway start and summary metadata"
        required: false
        default: "M2-R6-SERVICE-BOUNDARY-RECOVERY-SLO-106"
      iterations_per_profile:
        description: "Target successful probe iterations per profile"
        required: true
        default: "16"

jobs:
  scale-gate:
    name: Scale Gate (Self-Hosted Windows)
    runs-on: [self-hosted, windows]
    env:
      SCALE_HYPOTHESIS_ID: ${{ github.event.inputs.hypothesis_id || 'M2-R6-SERVICE-BOUNDARY-RECOVERY-SLO-106' }}
      SCALE_ITERATIONS_PER_PROFILE: ${{ github.event.inputs.iterations_per_profile || '16' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build WorldGateway
        shell: powershell
        run: dotnet build src/Adapter.WorldGateway/Adapter.WorldGateway.csproj

      - name: Start Retail Gateways
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/start_retail_gateways.ps1 `
            -HypothesisId "${{ env.SCALE_HYPOTHESIS_ID }}"

      - name: Run Scale Profiles Gate (1/4/8/16)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_world_probe_scale_profiles.ps1 `
            -HypothesisId "${{ env.SCALE_HYPOTHESIS_ID }}" `
            -IterationsPerProfile ${{ env.SCALE_ITERATIONS_PER_PROFILE }} `
            -Profiles "1,4,8,16"
