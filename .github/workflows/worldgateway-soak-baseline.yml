name: WorldGateway Soak Baseline

on:
  workflow_dispatch:
    inputs:
      hypothesis_id:
        description: "HypothesisId used for gateway start and summary metadata"
        required: false
        default: "M2-R6-SOCKETCLOSE-STAGE-BUDGETS-PROFILE-118"
      rounds:
        description: "Soak benchmark rounds"
        required: true
        default: "8"
      iterations_per_profile:
        description: "Scale iterations per profile"
        required: true
        default: "24"
      perf_iterations:
        description: "Perf gate successful iterations"
        required: true
        default: "60"
      perf_parallelism:
        description: "Perf gate parallelism"
        required: true
        default: "4"
      perf_max_socket_closed_failure_rate_pct:
        description: "max socket-closed perf failure rate in percent"
        required: true
        default: "5.0"
      perf_max_socket_closed_failures:
        description: "max socket-closed perf failed attempts count (-1 disables)"
        required: true
        default: "-1"
      scale_max_socket_closed_failure_rate_pct:
        description: "max socket-closed scale/runtime failure rate in percent"
        required: true
        default: "18.0"
      scale_profile_socket_closed_failure_rate_budgets:
        description: "per-profile socket-closed budgets (parallelism:percent CSV)"
        required: true
        default: "1:5,4:7,8:11,16:17,32:22"
      socket_closed_stage_failure_count_budgets:
        description: "optional perf stage socket-closed count budgets (stage:count CSV)"
        required: false
        default: "post_ack_read:2,await_enter_encrypted:2,unknown_socket_stage:2"
      socket_closed_stage_failure_rate_budgets:
        description: "optional runtime stage socket-closed rate budgets (stage:percent CSV)"
        required: false
        default: "post_ack_read:5,await_enter_encrypted:5,unknown_socket_stage:5"
      scale_profile_socket_closed_stage_failure_rate_budgets:
        description: "optional runtime per-profile stage socket-closed rate budgets (parallelism:stage:percent CSV)"
        required: false
        default: "1:post_ack_read:5,1:await_enter_encrypted:5,1:unknown_socket_stage:5,4:post_ack_read:5,4:await_enter_encrypted:5,4:unknown_socket_stage:5,8:post_ack_read:7,8:await_enter_encrypted:7,8:unknown_socket_stage:7,16:post_ack_read:10,16:await_enter_encrypted:10,16:unknown_socket_stage:10,32:post_ack_read:14,32:await_enter_encrypted:14,32:unknown_socket_stage:14"

jobs:
  soak-baseline:
    name: Soak Baseline (Self-Hosted Windows)
    runs-on: [self-hosted, windows]
    env:
      SOAK_HYPOTHESIS_ID: ${{ github.event.inputs.hypothesis_id || 'M2-R6-SOCKETCLOSE-STAGE-BUDGETS-PROFILE-118' }}
      SOAK_ROUNDS: ${{ github.event.inputs.rounds || '8' }}
      SOAK_ITERATIONS_PER_PROFILE: ${{ github.event.inputs.iterations_per_profile || '24' }}
      SOAK_PERF_ITERATIONS: ${{ github.event.inputs.perf_iterations || '60' }}
      SOAK_PERF_PARALLELISM: ${{ github.event.inputs.perf_parallelism || '4' }}
      SOAK_PERF_MAX_SOCKET_CLOSED_FAILURE_RATE_PCT: ${{ github.event.inputs.perf_max_socket_closed_failure_rate_pct || '5.0' }}
      SOAK_PERF_MAX_SOCKET_CLOSED_FAILURES: ${{ github.event.inputs.perf_max_socket_closed_failures || '-1' }}
      SOAK_SCALE_MAX_SOCKET_CLOSED_FAILURE_RATE_PCT: ${{ github.event.inputs.scale_max_socket_closed_failure_rate_pct || '18.0' }}
      SOAK_SCALE_PROFILE_SOCKET_CLOSED_FAILURE_RATE_BUDGETS: ${{ github.event.inputs.scale_profile_socket_closed_failure_rate_budgets || '1:5,4:7,8:11,16:17,32:22' }}
      SOAK_SOCKET_CLOSED_STAGE_FAILURE_COUNT_BUDGETS: ${{ github.event.inputs.socket_closed_stage_failure_count_budgets || 'post_ack_read:2,await_enter_encrypted:2,unknown_socket_stage:2' }}
      SOAK_SOCKET_CLOSED_STAGE_FAILURE_RATE_BUDGETS: ${{ github.event.inputs.socket_closed_stage_failure_rate_budgets || 'post_ack_read:5,await_enter_encrypted:5,unknown_socket_stage:5' }}
      SOAK_SCALE_PROFILE_SOCKET_CLOSED_STAGE_FAILURE_RATE_BUDGETS: ${{ github.event.inputs.scale_profile_socket_closed_stage_failure_rate_budgets || '1:post_ack_read:5,1:await_enter_encrypted:5,1:unknown_socket_stage:5,4:post_ack_read:5,4:await_enter_encrypted:5,4:unknown_socket_stage:5,8:post_ack_read:7,8:await_enter_encrypted:7,8:unknown_socket_stage:7,16:post_ack_read:10,16:await_enter_encrypted:10,16:unknown_socket_stage:10,32:post_ack_read:14,32:await_enter_encrypted:14,32:unknown_socket_stage:14' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build WorldGateway
        shell: powershell
        run: dotnet build src/Adapter.WorldGateway/Adapter.WorldGateway.csproj

      - name: Run Soak Baseline
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_world_probe_soak_baseline.ps1 `
            -HypothesisId "${{ env.SOAK_HYPOTHESIS_ID }}" `
            -Rounds ${{ env.SOAK_ROUNDS }} `
            -IterationsPerProfile ${{ env.SOAK_ITERATIONS_PER_PROFILE }} `
            -PerfIterations ${{ env.SOAK_PERF_ITERATIONS }} `
            -PerfParallelism ${{ env.SOAK_PERF_PARALLELISM }} `
            -PerfMaxSocketClosedFailureRatePercent ${{ env.SOAK_PERF_MAX_SOCKET_CLOSED_FAILURE_RATE_PCT }} `
            -PerfMaxSocketClosedFailures ${{ env.SOAK_PERF_MAX_SOCKET_CLOSED_FAILURES }} `
            -PerfSocketClosedStageFailureCountBudgets "${{ env.SOAK_SOCKET_CLOSED_STAGE_FAILURE_COUNT_BUDGETS }}" `
            -ScaleMaxSocketClosedFailureRatePercent ${{ env.SOAK_SCALE_MAX_SOCKET_CLOSED_FAILURE_RATE_PCT }} `
            -ScaleProfileSocketClosedFailureRateBudgets "${{ env.SOAK_SCALE_PROFILE_SOCKET_CLOSED_FAILURE_RATE_BUDGETS }}" `
            -ScaleProfileSocketClosedStageFailureRateBudgets "${{ env.SOAK_SCALE_PROFILE_SOCKET_CLOSED_STAGE_FAILURE_RATE_BUDGETS }}" `
            -SocketClosedStageFailureRateBudgets "${{ env.SOAK_SOCKET_CLOSED_STAGE_FAILURE_RATE_BUDGETS }}"
